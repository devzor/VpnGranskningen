services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vpngranskningen
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/VpnGranskningen.Infrastructure/Persistence/Schema:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vpngranskningen"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
